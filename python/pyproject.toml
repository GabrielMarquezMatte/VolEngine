[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volengine"
version = "0.9.0.dev0"
description = "GARCH volatility estimation over the VolEngine C API"
requires-python = ">=3.11"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest", "mypy"]
bench = ["arch"]

[tool.hatch.build.targets.wheel]
packages = ["src/volengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
