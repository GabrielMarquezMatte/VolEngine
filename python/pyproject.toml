[build-system]
requires = ["hatchling", "packaging"]
build-backend = "hatchling.build"

[project]
name = "volengine"
version = "1.3.0"
description = "GARCH volatility estimation over the VolEngine C API"
requires-python = ">=3.11"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest", "mypy", "hatchling"]
bench = ["arch"]

[tool.hatch.build.targets.wheel]
packages = ["src/volengine"]
exclude = ["src/volengine/_lib"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
