[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volengine"
version = "0.1.0"
description = "GARCH volatility estimation over the VolEngine C API"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/volengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
