name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            preset: native-release
            library: build/native-release/Release/volengine.dll
          - name: linux-gcc
            os: ubuntu-24.04
            preset: native-release
            library: build/native-release/libvolengine.so
          - name: macos-clang
            os: macos-latest
            preset: native-release
            library: build/native-release/libvolengine.dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner's Python is what CMake finds for the `style` test; 3.14 is the version the project develops on.
      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # The project targets GCC 15 or newer; ubuntu-24.04 ships an older default, so Linux installs it
      # from the toolchain PPA and passes it to CMake through CC and CXX.
      - name: Install GCC 15 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15
          echo "CC=gcc-15" >> "$GITHUB_ENV"
          echo "CXX=g++-15" >> "$GITHUB_ENV"

      # CMake picks the newest Visual Studio on the runner, so the job does not depend on one generator name.
      - name: Print CMake version
        run: cmake --version

      - name: Print GCC version (Linux)
        if: runner.os == 'Linux'
        run: g++-15 --version

      # The sources use std::ranges algorithms and std::numbers (no std::expected, mdspan or <format>), which
      # libc++ ships from Xcode 15 (Apple Clang 15). The runner's Apple Clang is used as shipped, if new enough.
      - name: Check Apple Clang version (macOS)
        if: runner.os == 'macOS'
        run: |
          clang++ --version
          major=$(clang++ --version | sed -n 's/.*clang version \([0-9]*\)\..*/\1/p' | head -n 1)
          if [ -z "$major" ] || [ "$major" -lt 15 ]; then
            echo "::error::Apple Clang 15 or newer is required for std::ranges; found '$major'"
            exit 1
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (C++ and style)
        run: ctest --preset ${{ matrix.preset }}

      # Benchmarks are built to keep them compiling, never run: shared runners give no stable timings.
      - name: Build benchmarks (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/bench -DCMAKE_BUILD_TYPE=Release -DVE_BUILD_BENCHMARKS=ON -DVE_BUILD_TESTS=OFF
          cmake --build build/bench --target volengine_benchmarks

      - name: Python tests (3.14)
        shell: bash
        env:
          VOLENGINE_LIB: ${{ github.workspace }}/${{ matrix.library }}
        run: |
          python -m pip install -e "python[test]"
          python -m pytest python/tests -q

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python tests (3.11, the requires-python floor)
        shell: bash
        env:
          VOLENGINE_LIB: ${{ github.workspace }}/${{ matrix.library }}
        run: |
          python -m pip install -e "python[test]"
          python -m pytest python/tests -q

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy ninja-build

      - name: Configure
        run: |
          clang-tidy --version
          cmake -S . -B build/tidy -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DVE_BUILD_TESTS=OFF

      - name: Run clang-tidy over src/
        run: git ls-files 'src/*.cpp' | xargs clang-tidy -p build/tidy
