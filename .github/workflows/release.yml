name: Release

# A v* tag publishes the wheels to PyPI, the native libraries to a GitHub Release and the .NET package to nuget.org;
# a tag with a '-' (v1.0.0-rc.1) is a prerelease. A manual run is a dry run unless dry_run is turned off: it builds
# and tests everything and skips the steps that publish.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build everything but publish nothing'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels
    uses: ./.github/workflows/wheels.yml
    with:
      # A manual run builds the version in the repository: the ref is a branch there, not a tag.
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  # The Windows DLL is built by MinGW; MSVC users link against a .lib made from the export list of the ABI contract. The
  # .lib and the MinGW .dll.a both record libvolengine.dll, so one file name serves both toolchains.
  windows-lib:
    name: Windows import library
    needs: wheels
    runs-on: windows-latest
    steps:
      - name: Download the Windows library
        uses: actions/download-artifact@v4
        with:
          name: native-win-x64

      - name: Set up the MSVC tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the import library
        shell: cmd
        run: lib /def:volengine-native-win-x64.def /name:libvolengine.dll /machine:x64 /out:volengine-native-win-x64.lib

      - name: Upload the import library
        uses: actions/upload-artifact@v4
        with:
          name: native-win-x64-lib
          path: volengine-native-win-x64.lib
          if-no-files-found: error

  # The libabigail dump of the Linux x64 library: the baseline of the abidiff job of ci.yml for the next change.
  abi-dump:
    name: ABI dump
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the toolchain and libabigail
        run: bash scripts/install_abi_tools.sh

      - name: Dump the ABI
        run: bash scripts/abi_dump.sh volengine-abi-linux-x64.xml

      - name: Upload the dump
        uses: actions/upload-artifact@v4
        with:
          name: abi-linux-x64
          path: volengine-abi-linux-x64.xml
          if-no-files-found: error

  publish-github:
    name: GitHub Release
    needs: [ wheels, windows-lib, abi-dump ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: assets
          merge-multiple: true

      - name: Download the ABI dump
        uses: actions/download-artifact@v4
        with:
          name: abi-linux-x64
          path: assets

      # The .def only feeds the .lib; it is not a release asset.
      - name: Drop the export list
        run: |
          rm assets/*.def
          ls -l assets

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          path: assets
          format: spdx-json
          output-file: volengine.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish the GitHub Release
        if: github.event_name == 'push' || !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            assets/*.dll
            assets/*.dll.a
            assets/*.lib
            assets/*.so
            assets/*.dylib
            assets/volengine-abi-linux-x64.xml
            volengine.spdx.json

  publish-pypi:
    name: PyPI
    needs: publish-github
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Publish to PyPI
        if: github.event_name == 'push' || !inputs.dry_run
        run: uv publish --trusted-publishing always dist/*

  # The .NET package: the assembly and the seven native libraries of the wheels job, each as
  # runtimes/<rid>/native/libvolengine.<ext>. Its version is the tag without the v; a manual run packs the version in
  # the repository with -dev.
  nuget:
    name: NuGet package
    needs: wheels
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: natives
          merge-multiple: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            version="$(sed -n 's/^set(VE_VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)-dev"
          fi
          dotnet pack csharp/src/VolEngine -c Release -p:Version="$version" -p:VolEngineNativeAssets="$PWD/natives" -o nuget
          echo "$version" > nuget/version.txt
          ls -l nuget

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: nuget/
          if-no-files-found: error

  # The package as a user gets it, on each system: a clean consumer restored from it, run without VOLENGINE_LIB, then
  # published with Native AOT.
  nuget-check:
    name: NuGet package check (${{ matrix.os }})
    needs: nuget
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nuget

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install the Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Check the package
        shell: bash
        run: bash csharp/scripts/check_package.sh nuget "$(cat nuget/version.txt)"

  # Trusted Publishing: nuget.org trusts this workflow (a policy its owner registers) and NuGet/login trades the OIDC
  # token for a short-lived API key. NUGET_USER is the nuget.org account, a repository variable. Only a tag publishes: a
  # nuget.org version is permanent, and a manual run from a branch packs a -dev version.
  publish-nuget:
    name: NuGet
    needs: [ publish-github, nuget-check ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: nuget

      - name: Log in to nuget.org
        id: login
        if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run)
        run: >-
          dotnet nuget push nuget/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json --skip-duplicate
